---
layout: default
---
<article class="page post-article">
  <header class="page-header"><a class="eyebrow" href="{{ '/Adventures' | relative_url }}"><span class="link-arrow" aria-hidden="true">←</span> Back to the journal</a><h1>{{ page.title }}<span class="brand-dot">.</span></h1><time class="post-date" datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%B %d, %Y' }}</time></header>
  <div class="page-content post-content">{{ content }}</div>
</article>
{% if site.related_posts.size > 0 %}<aside class="related"><span class="eyebrow">Keep exploring</span><div class="related-grid">{% for post in site.related_posts limit:3 %}<a href="{{ post.url | relative_url }}"><h3>{{ post.title }} <span class="link-arrow" aria-hidden="true">↗</span></h3><time>{{ post.date | date: '%b %Y' }}</time></a>{% endfor %}</div></aside>{% endif %}
