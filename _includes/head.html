<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f2ea">
  <title>{% if page.title == "Home" %}Aditya Anikode — Engineer & Explorer{% else %}{{ page.title | escape }} — Aditya Anikode{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{{ page.title | escape }} — Aditya Anikode">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | escape }}">
  <meta property="og:image" content="{{ '/public/images/iceland.jpg' | absolute_url }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <link rel="icon" href="{{ '/public/favicon.ico' | relative_url }}">
  {% if page.journal_map %}
  <script src="{{ '/public/js/journal-map.js' | relative_url }}" defer></script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/public/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="Aditya Anikode" href="{{ '/atom.xml' | relative_url }}">
  <script src="{{ '/public/js/site.js' | relative_url }}" defer></script>
</head>
